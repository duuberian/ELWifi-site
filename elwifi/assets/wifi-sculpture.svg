<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" fill="none">
  <defs>
    <linearGradient id="edge" x1="180" y1="30" x2="180" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66854e"/><stop offset="1" stop-color="#335137"/>
    </linearGradient>
    <linearGradient id="face" x1="110" y1="38" x2="238" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f1bd"/><stop offset=".35" stop-color="#b8d594"/><stop offset=".72" stop-color="#8cb46d"/><stop offset="1" stop-color="#628c50"/>
    </linearGradient>
    <linearGradient id="bevel" x1="180" y1="25" x2="180" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efffd9"/><stop offset="1" stop-color="#a7c78b"/>
    </linearGradient>
    <g id="arcs" stroke-width="27" stroke-linecap="round">
      <path d="M57 83a190 190 0 0 1 246 0"/>
      <path d="M96 127a130 130 0 0 1 168 0"/>
      <path d="M136 171a68 68 0 0 1 88 0"/>
