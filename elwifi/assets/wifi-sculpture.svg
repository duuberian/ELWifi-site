  </g>
  <circle cx="180" cy="219" r="17" fill="#38573a"/>
  <circle cx="180" cy="215" r="17" fill="#5b7f47"/>
  <use href="#arcs" stroke="url(#bevel)"/>
  <g stroke="url(#face)" stroke-width="24" stroke-linecap="round" transform="translate(0 1.5)">
    <path d="M57 83a190 190 0 0 1 246 0"/>
    <path d="M96 127a130 130 0 0 1 168 0"/>
    <path d="M136 171a68 68 0 0 1 88 0"/>
  </g>
  <circle cx="180" cy="210" r="17" fill="url(#bevel)"/>
  <circle cx="180" cy="211.5" r="15.5" fill="url(#face)"/>
